version: 2

seeds:
  - name: crm_customer
    description: Master customer list. Master data always wins.
    config:
      column_types:
        customer_id: integer
        customer_name: varchar
        city: varchar
        state: varchar
        segment: varchar
  - name: incoming_customer
    description: >
      Landing table for incoming batches. Rebuilt by scripts/run.py from
      state/loaded_files.json on every run, so it is a pure function of state.
    config:
      column_types:
        source_file: varchar
        row_num: integer
        customer_id: integer
        customer_name: varchar
        city: varchar
        state: varchar
        segment: varchar
