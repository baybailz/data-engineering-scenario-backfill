version: 2

seeds:
  - name: crm_store
    description: Master store list. Master data always wins.
    config:
      column_types:
        store_id: varchar
        store_name: varchar
        region: varchar
  - name: incoming_sale
    description: >
      Landing table for incoming daily sale files. Rebuilt by scripts/run.py
      from state/loaded_files.json on every run, so it is a pure function of
      state, not an append-only log.
    config:
      column_types:
        source_file: varchar
        sale_id: varchar
        store_id: varchar
        sale_date: date
        gross_amount: decimal(10,2)
        tax_amount: decimal(10,2)
        channel: varchar
