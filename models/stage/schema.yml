version: 2

models:
  - name: stg_store
    description: Master stores, typed and renamed.
    columns:
      - name: store_id
        data_tests: [unique, not_null]
  - name: stg_sale
    description: Landing rows for every loaded daily sale file.
    columns:
      - name: sale_id
        data_tests: [unique, not_null]
      - name: store_id
        data_tests: [not_null]
      - name: sale_date
        data_tests: [not_null]
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: [online, in_store, phone]
