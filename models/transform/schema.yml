version: 2

models:
  - name: trn_tbl_sale
    description: >
      Net amount per incoming sale row. Rebuilt in full from every currently
      landed day, so it always reflects the current tax_bug state.
    columns:
      - name: sale_id
        data_tests: [unique, not_null]
      - name: net_amount
        data_tests: [not_null]
