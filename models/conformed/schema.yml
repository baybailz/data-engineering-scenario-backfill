# Conformed contracts: keys are unique and never null, every enum is one of
# a closed list, and no imported sale can share a fact row with itself.
version: 2

models:
  - name: dim_store
    description: The store dimension.
    columns:
      - name: store_key
        data_tests: [unique, not_null]
      - name: store_id
        data_tests: [unique, not_null]
  - name: fact_sale
    description: One row per sale, net_amount as computed by the last build.
    columns:
      - name: sale_key
        data_tests: [unique, not_null]
      - name: sale_id
        data_tests: [unique, not_null]
      - name: store_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_key
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: [online, in_store, phone]
  - name: dim_partition_status
    description: One row per sale_date, the watermark for what got rebuilt when.
    columns:
      - name: sale_date
        data_tests: [unique, not_null]
      - name: built_by_action
        data_tests:
          - accepted_values:
              arguments:
                values: [load_next, inject_bug, fix_and_backfill, reset]
