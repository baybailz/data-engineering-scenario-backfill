# Proves the local-LLM path works on a free runner: cold pull, warm cache,
# one JSON-mode answer, timings. Dispatch it; read the summary.
name: ollama-smoke
on:
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model tag
        default: qwen2.5:3b
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ollama
        id: ollama
        with:
          model: ${{ inputs.model || 'qwen2.5:3b' }}
      - name: Ask for JSON
        shell: bash
        run: |
          M="${{ inputs.model || 'qwen2.5:3b' }}"
          START=$(date +%s)
          curl -s localhost:11434/api/generate -d "{\"model\":\"$M\",\"format\":\"json\",\"stream\":false,
            \"prompt\":\"Are 'Acme Inc' and 'ACME, Incorporated' the same company? Answer as JSON {\\\"same\\\":bool,\\\"reason\\\":str}.\"}" > /tmp/out.json
          END=$(date +%s)
          python3 -c "import json;d=json.load(open('/tmp/out.json'));print(d['response']);print('eval tok/s', round(d['eval_count']/(d['eval_duration']/1e9),1))"
          {
            echo "### ollama smoke · $M"
            echo "- cache hit: ${{ steps.ollama.outputs.cache-hit }}"
            echo "- wall seconds for one answer: $((END-START))"
            echo '```json'; cat /tmp/out.json | python3 -c "import json,sys;print(json.load(sys.stdin)['response'])"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
