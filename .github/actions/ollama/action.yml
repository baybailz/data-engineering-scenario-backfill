# Start a local Ollama server on the runner with a model ready to use.
# Model blobs are cached between runs so a pull happens once, not every
# click. Use from a scenario workflow:
#
#   - uses: ./.github/actions/ollama
#     with: { model: "qwen2.5:3b" }
#   - run: curl -s localhost:11434/api/generate -d '{"model":"qwen2.5:3b","prompt":"hi","stream":false}'
name: ollama
description: Install Ollama, restore the model cache, serve, and pull the model.
inputs:
  model:
    description: Ollama model tag
    required: false
    default: qwen2.5:3b
outputs:
  cache-hit:
    description: whether the model came from cache
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Restore model cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.ollama/models
        key: ollama-${{ runner.os }}-${{ inputs.model }}
    - name: Install Ollama
      shell: bash
      run: curl -fsSL https://ollama.com/install.sh | sh
    - name: Serve
      shell: bash
      run: |
        nohup ollama serve > /tmp/ollama.log 2>&1 &
        for i in $(seq 1 30); do curl -fs localhost:11434/ >/dev/null && break; sleep 1; done
        curl -fs localhost:11434/ >/dev/null || { cat /tmp/ollama.log; exit 1; }
    - name: Pull model
      shell: bash
      run: |
        if ollama list | grep -q "^${{ inputs.model }}"; then echo "model cached"; else ollama pull "${{ inputs.model }}"; fi
        ollama list
